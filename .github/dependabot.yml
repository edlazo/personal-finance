# Títulos `build(deps): ...` / `build(deps-dev): ...` para pasar el job `prefix` de pr-checks.
version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # El proyecto corre en Node 24: los tipos de otra versión mayor describen APIs que no tiene.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    # La acción compuesta de .github/actions también usa actions de terceros.
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
