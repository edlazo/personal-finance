name: setup
description: Python 3.14.8 con las dependencias de desarrollo (cache de pip)

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14.8"
        cache: pip
        cache-dependency-path: requirements*.txt
    - run: pip install -r requirements-dev.txt
      shell: bash
