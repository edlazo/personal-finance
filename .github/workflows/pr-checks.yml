# Reglas de PR (CONTRIBUTING.md). Jobs encadenados: pr-rules -> prefix -> quality.
name: pr-checks

on:
  pull_request:
    branches: [develop, main]
    # edited: vuelve a validar cuando cambia el título.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_REF: ${{ github.head_ref }}
  BASE_REF: ${{ github.base_ref }}
  AUTHOR: ${{ github.event.pull_request.user.login }}

jobs:
  pr-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: origin (a main solo desde develop o hotfix/*)
        if: github.base_ref == 'main'
        run: |
          if [[ "$HEAD_REF" != develop && "$HEAD_REF" != hotfix/* ]]; then
            echo "::error::A main solo llegan PRs desde develop o hotfix/*, no desde '$HEAD_REF'."
            exit 1
          fi

      # PRs apilados: al mergear (squash) el anterior, el siguiente sigue trayendo el commit viejo
      # de ese PR. git cherry lo marca como ya aplicado (mismo contenido), así que solo cuentan y
      # se miden los commits cuyo contenido todavía no está en develop.
      - name: single-commit
        if: github.base_ref == 'develop'
        run: |
          new=$(git cherry "$BASE_SHA" "$HEAD_SHA" | awk '/^\+/ { print $2 }')
          count=$(grep -c . <<<"$new" || true)
          if (( count != 1 )); then
            echo "::error::El PR tiene $count commits nuevos y debe tener 1. Corregí con: git commit --amend y git push --force-with-lease."
            exit 1
          fi
          echo "NEW_COMMIT=$new" >> "$GITHUB_ENV"

      - name: size (additions + deletions <= 400)
        if: github.base_ref == 'develop'
        run: |
          lines=$(git diff --numstat "$NEW_COMMIT^" "$NEW_COMMIT" -- . \
            ':!migrations/versions' ':!docs' ':!requirements*.txt' ':!frontend/package-lock.json' ':!frontend/src/components/ui' \
            | awk '{ total += $1 + $2 } END { print total + 0 }')
          echo "additions + deletions: $lines (máximo 400)"
          if (( lines > 400 )); then
            echo "::error::El PR tiene $lines líneas (máximo 400). Dividilo en PRs más chicos."
            exit 1
          fi

      - name: branch-name
        if: github.base_ref == 'develop' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          if [[ ! "$HEAD_REF" =~ ^(feature|fix|hotfix|chore)/PF-[0-9]+-[a-z0-9-]+$ ]]; then
            echo "::error::La rama '$HEAD_REF' no respeta feature|fix|hotfix|chore/PF-<n>-<slug>."
            exit 1
          fi

  prefix:
    needs: pr-rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Título del PR
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Dependabot está exento de la key y del largo: sus títulos los arma GitHub.
          rules="--require-key --max-length 72"
          [[ "$AUTHOR" == "dependabot[bot]" ]] && rules=""
          python3 scripts/check_commit_msg.py $rules "$TITLE"

      - name: Commits del PR
        run: |
          mapfile -t subjects < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          # A main llegan los squash de develop: GitHub les suma " (#n)" al asunto y el largo ya
          # se validó como título de cada PR. Ahí solo se revisa el prefijo.
          limit="--max-length 72"
          [[ "$AUTHOR" == "dependabot[bot]" || "$BASE_REF" == main ]] && limit=""
          python3 scripts/check_commit_msg.py $limit "${subjects[@]}"

  quality:
    needs: prefix
    uses: ./.github/workflows/quality.yml
